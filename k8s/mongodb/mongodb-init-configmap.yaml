apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init-script
  namespace: microservices

data:
  init-mongo.js: |
    db = db.getSiblingDB('admin');

    db.createUser({
      user: "root",
      pwd: "root123",
      roles: ["root"]
    });

    db = db.getSiblingDB('logs_db');

    db.createUser({
      user: "kafka_writer",
      pwd: "secure_password",
      roles: [
        { role: "readWrite", db: "logs_db" }
      ]
    });