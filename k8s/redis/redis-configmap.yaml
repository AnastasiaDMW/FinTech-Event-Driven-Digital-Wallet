apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-configmap
  namespace: microservices
data:
  redis.conf: |
    appendonly yes
    save 60 1

    user gateway on >R4nd0mT0rngP@ssw0rd!XyZ ~*request_rate_limiter* +@all
    user auth on >Au1th$ecretP@sz163 ~auth:* ~user:* +@all

    user default off