spring:
  application:
    name: transactional-orchestrator
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/transactional_orchestrator
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    listener:
      ack-mode: record
account_service:
  url: ${ACCOUNT_URI}
gateway:
  public-key: ${GATEWAY_PUBLIC_KEY}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: transactional-orchestrator
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0   # 100% (для dev)
  otlp:
    tracing:
      endpoint: ${URI_JAEGER}
kafka-consumer:
  bootstrap-servers: ${BOOTSTRAP_SERVERS}
  group-id: transactional-orchestrator
  auto-offset-reset: earliest
  trusted-packages: com.example.transactional_orchestrator.dto

